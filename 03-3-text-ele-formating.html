<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- This makes the page responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Text Formatting</title>
</head>

<body>

    <!-- Main heading of the page -->
    <h1>HTML Text Formatting</h1>

    <!-- <b> makes the text bold -->
    <p>This is <b>bold text</b>.</p>

    <!-- <strong> shows that the text is important -->
    <p>This is <strong>important text</strong>.</p>

    <!-- <i> displays the text in italic style -->
    <p>This is <i>italic text</i>.</p>

    <!-- <em> is used to emphasize a word or sentence -->
    <p>This is <em>emphasized text</em>.</p>

    <!-- <mark> highlights the text -->
    <p>This is <mark>highlighted text</mark>.</p>

    <!-- <small> makes the text smaller than normal -->
    <p>This is <small>smaller text</small>.</p>

    <!-- <del> shows text that has been deleted -->
    <p>This is <del>deleted text</del>.</p>

    <!-- <ins> shows text that has been inserted -->
    <p>This is <ins>inserted text</ins>.</p>

    <!-- <sub> is used for subscript text -->
    <p>Water formula: H<sub>2</sub>O</p>

    <!-- <sup> is used for superscript text -->
    <p>Mathematical expression: x<sup>2</sup></p>

</body>
</html>
